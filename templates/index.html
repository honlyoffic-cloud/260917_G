<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛집노트 | 나만의 맛집 관리 웹앱</title>
    <meta name="description" content="Flask 기반의 맛집 저장·방문 기록·별점 관리 애플리케이션">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-background">
        <div class="glow-sphere glow-1"></div>
        <div class="glow-sphere glow-2"></div>
        <div class="glow-sphere glow-3"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-section">
                <div class="brand-icon">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="brand-title">맛집노트 <span class="brand-badge">PRO</span></h1>
                    <p class="brand-subtitle">가고 싶은 곳, 다녀온 곳을 한곳에 모아보세요</p>
                </div>
            </div>
            <div class="header-right">
                <div class="date-badge" id="currentDateBadge">
                    <i class="fa-regular fa-calendar-check"></i>
                    <span id="currentDateText">2026.09.17</span>
                </div>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <section class="stats-grid" aria-label="맛집 통계">
            <div class="stat-card" id="statCardTotal">
                <div class="stat-icon-wrapper total-icon">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">전체 맛집</span>
                    <span class="stat-value" id="statTotalCount">0</span>
                </div>
            </div>
            <div class="stat-card" id="statCardPending">
                <div class="stat-icon-wrapper pending-icon">
                    <i class="fa-regular fa-bookmark"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">방문 예정</span>
                    <span class="stat-value" id="statPendingCount">0</span>
                </div>
            </div>
            <div class="stat-card" id="statCardCompleted">
                <div class="stat-icon-wrapper completed-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">방문 완료 <span id="statAvgRating"></span></span>
                    <span class="stat-value" id="statCompletedCount">0</span>
                </div>
            </div>
            <div class="stat-card progress-card" id="statCardProgress">
                <div class="stat-progress-header">
                    <span class="stat-label">방문률</span>
                    <span class="stat-rate-text" id="statRateText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="statProgressBar" style="width: 0%;"></div>
                </div>
            </div>
        </section>

        <!-- Quick Add Form Card -->
        <section class="add-task-card glass-panel">
            <h2 class="section-title">
                <i class="fa-solid fa-plus-circle"></i> 새 맛집 등록
            </h2>
            <form id="addRestaurantForm" class="todo-form">
                <div class="form-main-row">
                    <div class="input-with-icon flex-grow">
                        <i class="fa-solid fa-store input-icon"></i>
                        <input
                            type="text"
                            id="nameInput"
                            class="modern-input"
                            placeholder="가게 이름을 입력하세요 (예: 을지로 골뱅이)"
                            required
                            autocomplete="off"
                        >
                    </div>
                    <button type="button" id="toggleDetailsBtn" class="btn-secondary" title="세부 옵션 펼치기/접기">
                        <i class="fa-solid fa-sliders"></i> 옵션
                    </button>
                    <button type="submit" id="addSubmitBtn" class="btn-primary">
                        <i class="fa-solid fa-plus"></i> 추가하기
                    </button>
                </div>

                <!-- Collapsible detail options -->
                <div class="form-details-row" id="formDetailsRow">
                    <div class="detail-field">
                        <label for="categorySelect"><i class="fa-solid fa-tag"></i> 카테고리</label>
                        <select id="categorySelect" class="modern-select">
                            <option value="한식">한식</option>
                            <option value="중식">중식</option>
                            <option value="일식">일식</option>
                            <option value="양식">양식</option>
                            <option value="카페">카페</option>
                            <option value="디저트">디저트</option>
                            <option value="술집">술집</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>

                    <div class="detail-field">
                        <label for="priceSelect"><i class="fa-solid fa-won-sign"></i> 가격대</label>
                        <select id="priceSelect" class="modern-select">
                            <option value="저렴">💰 저렴</option>
                            <option value="보통" selected>💰💰 보통</option>
                            <option value="비쌈">💰💰💰 비쌈</option>
                        </select>
                    </div>

                    <div class="detail-field">
                        <label for="addressInput"><i class="fa-solid fa-location-dot"></i> 위치/주소</label>
                        <input type="text" id="addressInput" class="modern-input" placeholder="예: 서울 마포구 연남동">
                    </div>

                    <div class="detail-field">
                        <label for="linkInput"><i class="fa-solid fa-link"></i> 참고 링크</label>
                        <input type="text" id="linkInput" class="modern-input" placeholder="네이버지도, 인스타 등 URL">
                    </div>

                    <div class="detail-field full-width">
                        <label for="memoInput"><i class="fa-regular fa-note-sticky"></i> 메모 (선택)</label>
                        <input type="text" id="memoInput" class="modern-input" placeholder="추천 메뉴, 후기 등을 적어두세요">
                    </div>
                </div>
            </form>
        </section>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar-section">
            <div class="status-tabs" role="tablist">
                <button type="button" class="tab-btn active" data-status="all" id="tabAll">
                    전체 <span class="tab-count" id="countAll">0</span>
                </button>
                <button type="button" class="tab-btn" data-status="planned" id="tabActive">
                    방문 예정 <span class="tab-count" id="countActive">0</span>
                </button>
                <button type="button" class="tab-btn" data-status="visited" id="tabCompleted">
                    방문 완료 <span class="tab-count" id="countCompleted">0</span>
                </button>
            </div>

            <div class="toolbar-controls">
                <!-- Search input -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="가게명, 주소, 메모 검색..." autocomplete="off">
                    <button type="button" id="clearSearchBtn" class="clear-btn" style="display: none;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Category Filter -->
                <select id="filterCategory" class="toolbar-select" title="카테고리 필터">
                    <option value="all">모든 카테고리</option>
                    <option value="한식">한식</option>
                    <option value="중식">중식</option>
                    <option value="일식">일식</option>
                    <option value="양식">양식</option>
                    <option value="카페">카페</option>
                    <option value="디저트">디저트</option>
                    <option value="술집">술집</option>
                    <option value="기타">기타</option>
                </select>

                <!-- Rating Filter -->
                <select id="filterPriority" class="toolbar-select" title="별점 필터">
                    <option value="all">모든 별점</option>
                    <option value="5">★5</option>
                    <option value="4">★4</option>
                    <option value="3">★3</option>
                    <option value="2">★2</option>
                    <option value="1">★1</option>
                </select>

                <!-- Sort Filter -->
                <select id="sortOrder" class="toolbar-select" title="정렬 기준">
                    <option value="created_desc">최신 등록순</option>
                    <option value="rating_desc">별점 높은순</option>
                    <option value="name">가게 이름순</option>
                    <option value="created_asc">오래된순</option>
                </select>
            </div>
        </section>

        <!-- Restaurant List Container -->
        <main class="todo-list-wrapper">
            <div id="todoList" class="todo-list">
                <!-- Javascript will render restaurant cards here -->
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="spinner-wrapper" style="display: none;">
                <div class="spinner"></div>
                <p>목록을 불러오는 중...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon-box">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h3 class="empty-title">등록된 맛집이 없습니다</h3>
                <p class="empty-desc">가보고 싶은 맛집이나 다녀온 맛집을 등록해보세요!</p>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay" style="display: none;">
        <div class="modal-card glass-panel">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> 맛집 정보 수정</h3>
                <button type="button" class="modal-close-btn" id="closeEditModalBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="editRestaurantForm" class="modal-form">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editNameInput">가게 이름</label>
                    <input type="text" id="editNameInput" class="modern-input" required>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label for="editCategorySelect">카테고리</label>
                        <select id="editCategorySelect" class="modern-select">
                            <option value="한식">한식</option>
                            <option value="중식">중식</option>
                            <option value="일식">일식</option>
                            <option value="양식">양식</option>
                            <option value="카페">카페</option>
                            <option value="디저트">디저트</option>
                            <option value="술집">술집</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPriceSelect">가격대</label>
                        <select id="editPriceSelect" class="modern-select">
                            <option value="저렴">💰 저렴</option>
                            <option value="보통">💰💰 보통</option>
                            <option value="비쌈">💰💰💰 비쌈</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editAddressInput">위치/주소</label>
                    <input type="text" id="editAddressInput" class="modern-input">
                </div>
                <div class="form-group">
                    <label for="editLinkInput">참고 링크</label>
                    <input type="text" id="editLinkInput" class="modern-input">
                </div>
                <div class="form-group">
                    <label for="editRatingSelect">별점</label>
                    <select id="editRatingSelect" class="modern-select">
                        <option value="0">평가 안 함</option>
                        <option value="1">★☆☆☆☆ (1)</option>
                        <option value="2">★★☆☆☆ (2)</option>
                        <option value="3">★★★☆☆ (3)</option>
                        <option value="4">★★★★☆ (4)</option>
                        <option value="5">★★★★★ (5)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editMemoInput">메모</label>
                    <textarea id="editMemoInput" class="modern-textarea" rows="3" placeholder="추천 메뉴, 후기 등..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelEditBtn">취소</button>
                    <button type="submit" class="btn-primary" id="saveEditBtn">
                        <i class="fa-solid fa-check"></i> 변경사항 저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
